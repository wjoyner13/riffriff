<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1C36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RIFF/GOD" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Lets a phone add this to its Home Screen with no browser chrome at
         all — the one way to reliably hide the address bar on iOS Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>RIFF/GOD</title>
    <meta name="description" content="Listen to the sequences, repeat them and race your friends to see who prevails." />
    <!-- Link-preview card for shared links. On invite links (?from=Name) the
         netlify/edge-functions/invite-preview.js function swaps in the inviter's name. -->
    <meta property="og:title" content="You've been challenged to a round of Riff God" />
    <meta property="og:description" content="Listen to the sequences, repeat them and race your friends to see who prevails." />
    <meta property="og:site_name" content="RIFF/GOD" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Beats the shared index.css background so overscroll shows this palette. */
      html:root,
      html:root body,
      html:root #root {
        background: #1e1c36;
      }
      @keyframes riff-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
